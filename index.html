
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>NIET - National Institute of Engineering and Technology | Engineering Programs in Nepal</title>
      <meta name="description" content="NIET (National Institute of Engineering and Technology) offers cutting-edge engineering programs including BTech in AI, BE in Biomedical Engineering, and BE in Computer Engineering. Affiliated with Purbanchal University." />
      <link rel="icon" type="image/x-icon" href="/logo.ico">
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Graduate&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>

    <body>
      <div id="root"></div>
      
      <!-- Hidden form for Netlify Bot detection -->
      <form name="inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
        <input type="hidden" name="form-name" value="inquiry" />
        <input type="hidden" name="bot-field" />
        <input type="hidden" name="ref-id" />
        <input type="text" name="fullName" />
        <input type="email" name="email" />
        <input type="text" name="contact" />
        <input type="text" name="dob" />
        <input type="text" name="gender" />
        <input type="text" name="nationality" />
        <input type="text" name="addrTemp" />
        <input type="text" name="addrPerm" />
        <input type="text" name="parentName" />
        <input type="text" name="parentContact" />
        <textarea name="programs"></textarea>
        <input type="text" name="see-inst" />
        <input type="text" name="see-board" />
        <input type="text" name="see-year" />
        <input type="text" name="see-grade" />
        <input type="text" name="plus2-inst" />
        <input type="text" name="plus2-board" />
        <input type="text" name="plus2-year" />
        <input type="text" name="plus2-grade" />
      </form>

      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
